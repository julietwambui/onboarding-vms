name: CI Pipeline

on:
  push:
    branches:
      - integration-vms

  pull_request:
    branches:
      - integration-vms

jobs:
  backend-tests:
    name: Backend Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vms_test

      - name: Push Prisma Schema
        working-directory: backend
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vms_test

      - name: Build Backend
        working-directory: backend
        run: npm run build

      - name: Run Backend Tests
        working-directory: backend
        run: npm test
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vms_test

  frontend-tests:
    name: Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Frontend
        working-directory: frontend
        run: npm run build

      - name: Run Frontend Tests
        working-directory: frontend
        run: npm test

  e2e-tests:
    name: BDD & Playwright Tests
    needs:
      - backend-tests
      - frontend-tests

    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: vms_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install Backend Dependencies
        working-directory: backend
        run: npm install

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Install E2E Dependencies
        working-directory: e2e
        run: npm install

      - name: Install Playwright Browsers
        working-directory: e2e
        run: npx playwright install --with-deps chromium

      - name: Generate Prisma Client
        working-directory: backend
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vms_test

      - name: Push Prisma Schema
        working-directory: backend
        run: npx prisma db push
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vms_test

      - name: Start Backend
        working-directory: backend
        run: |
            npm run build
            npm run start &
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vms_test
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          FRONTEND_URL: http://localhost:3000
          PORT: 4000

      - name: Build Frontend
        working-directory: frontend
        run: npm run build
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Start Frontend
        working-directory: frontend
        run: npm run start &
        env:
          NEXT_PUBLIC_API_URL: http://localhost:4000

      - name: Wait for Backend and Frontend
        run: npx wait-on http://localhost:3000 http://localhost:4000/health --timeout 60000

      - name: Seed Test Data 
        working-directory: backend
        run: |
         npx ts-node prisma/seed.ts
         npx ts-node prisma/seedVisitors.ts
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vms_test

      - name: Verify Seed Data
        run: |
          PGPASSWORD=postgres psql -h localhost -U postgres -d vms_test -c "SELECT email, role FROM \"User\";"
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/vms_test

      - name: Test Backend Login API
        run: |
          curl -X POST http://localhost:4000/auth/login \
            -H "Content-Type: application/json" \
            -d '{"email":"admin@vms.com","password":"admin123"}' \
            -v

      - name: Run BDD Tests
        working-directory: e2e
        run: npm test

      - name: Run Playwright Tests
        working-directory: e2e
        run: npx playwright test

      - name: Upload Playwright Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: e2e/playwright-report

      - name: Upload Playwright Test Results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: e2e/test-results

      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: e2e/cucumber-report.html